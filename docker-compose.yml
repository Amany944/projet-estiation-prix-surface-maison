# Lance les deux services : backend FastAPI (8000) et frontend Vite (5173).
#   docker compose up --build
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Origine autorisée pour CORS (le navigateur tourne sur l'hôte).
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./Api-python-js:/app
      # Volume anonyme : garde les node_modules du conteneur au lieu d'écraser
      # ceux de l'hôte (et inversement).
      - /app/node_modules
    environment:
      # Appelée depuis le NAVIGATEUR, donc localhost et non "backend".
      VITE_API_URL: http://127.0.0.1:8000
    depends_on:
      - backend
