# Déploiement de l'API (FastAPI + modèle scikit-learn) sur Azure Functions.
#
# Particularité de ce projet : le même service sert l'API ET le frontend React
# compilé (voir le `app.mount("/", StaticFiles(...))` dans backend/app/main.py).
# Le workflow compile donc Vite, puis assemble un dossier autonome
# (`azure-package/`) contenant exactement ce que le runtime Azure attend.
#
# Secrets / variables à définir dans GitHub (Settings > Secrets and variables
# > Actions) :
#   - secret   AZURE_FUNCTIONAPP_PUBLISH_PROFILE  : contenu du profil de
#                publication téléchargé depuis le portail Azure
#                (Function App > Vue d'ensemble > Obtenir le profil de publication)
#   - variable AZURE_FUNCTIONAPP_NAME             : nom de la Function App
#                (facultatif, sinon la valeur par défaut ci-dessous est utilisée)

name: Deploy Python project to Azure Function App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: azure-package
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- #
      # 1. Frontend : compilation Vite                                    #
      # ---------------------------------------------------------------- #
      - name: Installer Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Api-python-js/package-lock.json

      - name: Compiler le frontend
        working-directory: Api-python-js
        run: |
          # `.env.production` fixe VITE_API_URL=/ : les appels partent de la
          # même origine que la page, donc aucun problème de CORS en production.
          npm ci
          npm run build

      # ---------------------------------------------------------------- #
      # 2. Backend : dépendances et tests                                 #
      # ---------------------------------------------------------------- #
      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lancer les tests du backend
        run: python -m pytest backend/tests -q

      # ---------------------------------------------------------------- #
      # 3. Assemblage du paquet déployé                                    #
      # ---------------------------------------------------------------- #
      # Azure Functions exige une racine de paquet plate : function_app.py,
      # host.json et requirements.txt au premier niveau. On ne déploie donc
      # pas tout le dépôt (notebooks, second frontend, etc.), mais uniquement
      # le strict nécessaire.
      - name: Assembler le paquet Azure
        run: |
          set -euo pipefail
          PKG="${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
          rm -rf "$PKG"
          mkdir -p "$PKG"

          cp function_app.py host.json "$PKG"/
          cp -R backend "$PKG"/backend
          cp -R models "$PKG"/models
          mkdir -p "$PKG/Api-python-js"
          cp -R Api-python-js/dist "$PKG"/Api-python-js/dist
          cp backend/requirements.txt "$PKG"/requirements.txt

          # Nettoyage : caches inutiles et volumineux dans le paquet.
          find "$PKG" -name '__pycache__' -type d -prune -exec rm -rf {} +
          find "$PKG" -name '*.pyc' -delete

          echo "--- contenu du paquet ---"
          du -sh "$PKG"
          ls -1 "$PKG"

      # ---------------------------------------------------------------- #
      # 4. Déploiement                                                    #
      # ---------------------------------------------------------------- #
      - name: Déployer sur Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME || 'prix-immobilier-api' }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          # Oryx installe requirements.txt côté Azure : pas de binaires
          # compilés pour une autre plateforme dans le paquet.
          scm-do-build-during-deployment: true
          enable-oryx-build: true
